<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOOGOS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;background:#070F14;color:white;font-family:sans-serif;text-align:center}
.card{background:#14212C;margin:15px;border-radius:20px;padding:20px}
.btn{background:#00E5CC;color:black;border:none;padding:16px;border-radius:30px;width:100%;font-size:18px;font-weight:bold;margin-top:10px}
#map{height:400px;width:100%;border-radius:15px;margin-top:15px}
</style>
</head>
<body>
<h1 style="padding:15px">BOOGOS</h1>
<div class="card">
<h2>⛽ Fuel 72% - 312 KM Left</h2>
<h3 id="eng" style="color:#00E5CC">ENGINE STARTED</h3>
<button class="btn" onclick="let e=document.getElementById('eng'); e.innerText=e.innerText.includes('STARTED')?'ENGINE STOPPED':'ENGINE STARTED'">START / STOP ENGINE</button>
</div>
<div class="card">
<h3>📍 LIVE TRACKER</h3>
<button class="btn" id="mapBtn" onclick="startTracker()">📡 OPEN LIVE MAP - TRACK NOW</button>
<div id="map" style="display:none"></div>
<p id="status"></p>
</div>
<script>
function startTracker(){
 let btn=document.getElementById('mapBtn');
 btn.innerText="LOCATING...";
 document.getElementById('map').style.display='block';
 document.getElementById('status').innerText='GPS permission maang raha hai... Allow karo';
 
 navigator.geolocation.getCurrentPosition(function(p){
   let lat=p.coords.latitude, lng=p.coords.longitude;
   document.getElementById('status').innerText='✅ Live Location: '+lat.toFixed(4)+','+lng.toFixed(4);
   btn.innerText='✅ TRACKING LIVE';
   let map=L.map('map').setView([lat,lng], 15);
   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
   L.marker([lat,lng]).addTo(map).bindPopup('🚗 Teri Gaadi Yaha Hai!').openPopup();
   setTimeout(function(){ map.invalidateSize(); }, 500);
 }, function(err){
   alert('Bhai Location ALLOW karna padega! Phone setting me Location ON kar aur fir se Allow dabaa');
   document.getElementById('status').innerText='❌ Location Blocked - Allow karo';
   btn.innerText='TRY AGAIN - ALLOW LOCATION';
 }, {enableHighAccuracy:true});
}
</script>
</body>
</html>
